<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AlcoCalc</title>
    <base href="/" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="AlcoCalc.styles.css" />
    <link rel="stylesheet" href="_content/MudBlazor/MudBlazor.min.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
</head>

<body>
    <div id="app">
        <div class="app-loading">
            <div class="loading-card">
                <div class="loader">
                    <svg class="loading-progress" viewBox="0 0 100 100">
                        <defs>
                            <symbol viewBox="0 0 210 206" id="s_logo">
                                <path d="M189.397,172.185l-28.895,-79.334l23.151,-67.932l24.058,-0l-0,-24.919l-47.598,0l-37.62,101.316l-33.56,-0l-38.485,-101.316l-48.332,-0l0,24.919l23.411,-0l24.23,67.932l-30.018,79.334l-19.739,-0l0,33.815l37.923,0l27.902,-72.553l79.214,-0l24.922,72.553l40.039,0l-0,-33.815l-20.603,-0Z" />
                            </symbol>
                        </defs>

                        <circle class="loader-track"
                                cx="50" cy="50" r="42" />

                        <use href="#s_logo"
                             x="27"
                             y="26"
                             width="46"
                             height="45"
                             class="loader-logo"
                             transform="rotate(90 50 50)" />
                    </svg>
                </div>

                <div class="loading-title">Loading AlcoCalc</div>

                <div class="loading-dots">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                <a class="loading-email" href="mailto:kovac.tx@gmail.com">
                    kovac.tx@gmail.com
                </a>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['\\(', '\\)']],
                displayMath: [['\\[', '\\]']]
            },
            startup: {
                typeset: false
            }
        };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</body>

</html>

<style>
    .app-loading {
        width: 100%;
        height: 100vh;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(30,30,45,1);
        font-family: Arial, Helvetica, sans-serif;
        color: white;
    }

    .loading-card {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 45px 55px;
        padding-bottom: 65px;
        min-width: 280px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(12px);
    }

    .loading-email {
        position: absolute;
        right: 20px;
        bottom: 12px;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.35);
        letter-spacing: 0.2px;
        transition: color 0.2s ease;
    }

    .loading-email:hover {
        color: rgba(255, 255, 255, 0.75);
        text-decoration: underline;
    }

    .loader {
        position: relative;
        width: 130px;
        height: 130px;
        margin-bottom: 30px;
    }

    .loading-progress {
        width: 130px;
        height: 130px;
        transform: rotate(-90deg);
    }

    .loader-track {
        fill: none;
        stroke-width: 7;
        stroke: rgba(255, 255, 255, 0.12);
    }

    .loader-logo {
        fill: rgba(0, 108, 179, 1); /* rgba(0, 108, 179, 1) rgba(255, 255, 255, 0.9); */
    }

    .loading-title {
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 0.3px;
        margin-bottom: 8px;
    }

    .loading-dots {
        display: flex;
        gap: 7px;
        margin-top: 25px;
    }

    .loading-dots span {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #4da3ff;
        animation: loading-dot 1.2s infinite ease-in-out;
    }

    .loading-dots span:nth-child(2) {
        animation-delay: 0.15s;
    }

    .loading-dots span:nth-child(3) {
        animation-delay: 0.3s;
    }

    @keyframes loading-dot {
        0%, 80%, 100% {
            transform: scale(0.7);
            opacity: 0.4;
        }

        40% {
            transform: scale(1);
            opacity: 1;
        }
    }
</style>
